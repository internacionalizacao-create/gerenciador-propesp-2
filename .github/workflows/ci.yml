name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # O build do Next avalia `apps/web/src/lib/env.ts`, que se recusa a carregar
      # com ambiente incompleto. Sao valores de fachada: nada aqui e usado para
      # falar com um Keycloak de verdade, e nenhum deles vai para o bundle do
      # browser (o modulo e `server-only`).
      - run: pnpm build
        env:
          APP_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001
          KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/gerenciador
          KEYCLOAK_CLIENT_ID: gerenciador-web
          KEYCLOAK_CLIENT_SECRET: ci-placeholder
          SESSION_SECRET: Q0ktcGxhY2Vob2xkZXItMzItYnl0ZXMtLS0tLS0tLS0

      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gerenciador
          POSTGRES_PASSWORD: teste-ci
          POSTGRES_DB: gerenciador_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gerenciador -d gerenciador_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://gerenciador:teste-ci@127.0.0.1:5432/gerenciador_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Leitores reais de PDF e planilha
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils unzip libreoffice-calc
      - name: Regressões da proteção do banco de testes
        run: pnpm --filter api test:infra
      # Cada suite prepara suas fixtures; seed-aceite confere a seed operacional.
      # Jest serializa as suites e o helper aplica migrations antes da limpeza.
      - name: Integrações SQL, migrations e aceite da seed
        run: pnpm --filter api test:int --no-cache

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # O runner cria e remove seu proprio Postgres/realm/anexos, com fixtures.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jornadas-browser
          path: |
            .e2e/relatorio/
            .e2e/resultados/
          include-hidden-files: true
          retention-days: 7
